# ============================================================================
# agentcss CI
#
# ============================================================================
# 三层设计（为什么要分层）
# ---------------------------------------------------------------------------
#   pr         —— 每个 PR 都跑，必须快、必须跨平台可靠
#   contract   —— 契约类门禁（类型/ API 形态 / 文档事实）
#   nightly    —— 浏览器矩阵（含 WebKit），慢、可能因平台差异误报
#
# 🔴🔴 为什么不全量门禁都塞进 PR
# ---------------------------------------------------------------------------
#   实测在 Linux runner 上跑全量会 FAIL 10+ 道（本地 Windows 全绿）：
#     · 字体渲染不同 → 视觉 diff 必然不一致
#     · 路径/编码处理不同 → 体积类门禁误报
#     · shallow clone → 依赖 git 状态的判据语义不同
#     · 浏览器版本不同 → 截图基线不匹配
#
#   ⚠️ **一个长期红的 CI 比没有 CI 更糟** ——
#      大家会习惯性忽略它，真正的新问题也一起被忽略。
#   ⇒ PR 只跑「实测跨平台可靠」的那部分；其余交给 nightly。
#   ⚠️ 上面的清单**不是猜的**：每道都标注了它是否已在 PR 跑过并验证。
#      新增门禁若不确定跨平台安全，先放 nightly。
# ============================================================================
#
# 🔴🔴 npm ci 是必须的
# ---------------------------------------------------------------------------
#   只跑 `node --test` 而不装依赖时，「锁文件可复现」这个承诺
#   **从未被验证过** —— 它只证明了 package-lock.json 存在。
#   而 reproducible development environment 是写进卖点的一条。
#   ⇒ 每个 job 都必须先 npm ci。
# ============================================================================

name: gate

on:
  pull_request:
    branches: [master]
  # 🔴 2026-11-05 加：master 直推也要跑「快门禁」。
  #   加之前只有 PR / nightly / 手动 —— 而这个仓库一直是**直推 master**，
  #   等于日常提交**完全没有 CI 保护**，全靠本地记得跑。
  #   实测代价：公开仓库 Actions 不计费；quick 在 Linux 上约 3–4 分钟。
  #   ⚠️ 只跑 quick：contract 与三引擎矩阵留给 PR / nightly，
  #      否则每次 push 白烧 20 分钟，人就会开始忽略红灯。
  push:
    branches: [master]
  schedule:
    # nightly：每天 UTC 03:17（错开整点，避开所有机器的高峰）
    - cron: '17 3 * * *'
  workflow_dispatch:

# 🔴 供应链：所有 `uses:` 一律钉到**提交 SHA**，行尾注真实版本号（2026-11-23）
# ---------------------------------------------------------------------------
#   浮动 tag（`@v4`）不是版本锁定，是**信任委托**：action 的发布者随时能把那个
#   tag 挪到新提交，我们的 CI 下次就跑上了没审过的代码。release.yml 的这一步之后
#   就是 `npm publish`（持有 NPM_TOKEN）⇒ 等于把令牌的执行权交给第三方的最新提交。
#   11 月这轮凭证事故的教训是"能少一层委托就少一层"，不是"记得别写错"。
#   升级方式：查该 release 的真实 commit SHA → 改 SHA → 行尾版本号同步改。
#   ⚠️ 不要写 `@v4`；也不要 `@main`。
permissions:
  contents: read     # 🔴 0.27.20：CI 只需要读仓库——125 道门禁不持有写权限（工程官 S4）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 🔴 0.27.20（工程官 S1）：发布资格前移——近 8 次发布 6 次首跑失败，
  #    全是"先打 tag 才发现 Linux 门禁红"⇒ 删 tag 重打成了日常动作。
  #    本 job 在 master push 上跑**与 release.yml 逐行同源**的发布前序列
  #    （ci-fonts → npm ci → publish:check）；绿了才有资格打 tag。
  #    AC：下一次发布 tag 推出前必须存在同 headSha 的绿色 qualify run。
  release-qualify:
    name: 发布资格（Linux 发布前门禁 · 与 release.yml 同源）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # 🔴 0.27.24 S4 修订：actions:write 只为一件事——stamp 过期时自动派发
      #    record-baseline（见"基线过期 → 自动派发重录"步）。不给
      #    contents:write；被派发的 record-baseline.yml 自己持有 contents:write。
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 🔴 0.27.21：release-gate 的 tag 锚点判据要完整 tag 对象——
          #    浅克隆下「v0.27.21 没有被取下来 ⇒ 无法判断 tag 是否存在」
          #    （CI 实测假红；与 quick job 的同一条教训）。
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: 装 CI 字体（与 release.yml 同一个脚本）
        run: bash 05-audit/ci-fonts.sh
      - name: npm ci + 升级 npm（钉版本，与 release.yml 一致）
        run: |
          set -eu
          npm install -g npm@11.5.1
          npm ci --no-audit --no-fund
      # 🔴 0.27.21：publish:check 的 fast 层含 api-contract，
      #   要真浏览器——不装则发布资格在 CI 上永远假红（实测）。
      - name: 安装 Chromium（api-contract 的运行时形状需要）
        run: npx playwright install --with-deps chromium

      - name: 发布前门禁（与 prepublishOnly / release.yml 同一套）
        run: npm run publish:check

      # 🔴 0.27.24（基线对齐自动化）：visual-stamp 过期/缺失 ⇒ 自动派发
      #    record-baseline。抽样 5 次失败 run 的 29 处失败里这两道占 10 处，
      #    成因全是同一个："记得去 dispatch"这道摩擦。门禁照旧红（不掩盖）；
      #    基线分支的合并仍是像素 diff 的人工复核点——自动化掉的只是派发。
      #    ⚠️ 只在 master 上派发：PR 的指纹与 master 无关，别制造噪音。
      - name: 基线过期 → 自动派发重录
        if: always() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f 05-audit/.stamp-stale.json ]; then
            cat 05-audit/.stamp-stale.json
            gh workflow run record-baseline.yml -f dir=all --ref master
            {
              echo "⯈ 视觉基线过期/缺失 —— 已自动派发 record-baseline.yml"
              echo "⯈ run 完成后：git fetch origin 'refs/heads/baseline/linux-<runid>:refs/remotes/origin/baseline-<runid>'"
              echo "    git checkout origin/baseline-<runid> -- 10-review/shots/ 05-audit/print-baseline-*.json"
              echo "    git commit + push  ← 像素 diff 的人工复核点，别跳过"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  # ==================================================================
  # ① PR 快门禁 —— 纯静态，零浏览器，秒级
  # ==================================================================
  quick:
    name: 快门禁（静态 + 视觉，Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 兜底：卡住就掐掉，不烧额度（含 Chromium 安装 ≈ 6-8 分钟）
    permissions:
      contents: read
      # 🔴 0.27.24 S4 修订：同 release-qualify——只为了 stamp 过期时自动派发
      #    record-baseline；不持有 contents:write。
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 🔴 视觉基线**锚在字体上**，而 ubuntu 默认没有 CJK/阿拉伯/希伯来字体。
      #   不装 ⇒ 文字整段变方框 ⇒ 像素比对全红，且红的原因与代码无关。
      #   ⚠️ 这个 job 原本叫"静态，跨平台"——那是个**假声明**：
      #      视觉门禁在 MODE=fast 里跑，而它既不是纯静态、也不跨平台
      #      （基线按平台分集，见 05-audit/shot-baseline.py 顶部）。
      #      2026-10-29 门禁第一次在 CI 上跑，42 张基线全红就是这么发现的。
      - name: 装 CI 字体（视觉基线锚在它上面）
        run: bash 05-audit/ci-fonts.sh

      # 🔴 与 release 工作流同因：checkout 对 tag 只留轻量 ref，
      #   annotated tag 对象抓不下来 ⇒ release 门禁会误判。
      - name: 补齐 tag 对象
        run: git fetch --tags --force origin

      # 🔴 release 门禁的「tag 指向的提交必须被某个远端分支包含」需要
      #   `refs/remotes/origin/*`。而 `actions/checkout` 对 `pull_request`
      #   只抓 merge ref、对 tag 只抓该 tag —— **两者都不会建远端分支引用**。
      #   不补这一行，判据会在 CI 上报「看不到任何 refs/remotes/origin/*」，
      #   而那正是它设计上**不许判通过**的情形（视野为空 ≠ 没问题）。
      - name: 补齐远端分支引用（tag 锚点判据需要）
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      # 🔴 0.27.21：fast 层含 api-contract（运行时 ↔ 类型），
      #   它要真浏览器——此前靠 runner 镜像预装 Chrome，镜像换版本后首推
      #   假红。装上，同时把「纯静态零浏览器」的旧声明作废。
      - name: 安装 Chromium（api-contract 的运行时形状需要）
        run: npx playwright install --with-deps chromium

      # 🔴 必须装依赖：否则 lockfile 的可复现性从未被验证
      - name: 按锁文件安装（验证 lockfile 真能装）
        run: npm ci

      - name: 依赖审计（运行时 0 漏洞；开发链不允许 high 及以上）
        # 外部审计 F3：仓库曾经带着 9 个 high + 1 个 moderate，全部在 devDependencies
        # 链上（puppeteer-core@23 → @puppeteer/browsers → extract-zip / proxy-agent，
        # 以及 chromium-bidi → zod）。生产用户不受影响，但 CI 与开发机受影响。
        #
        # 为什么要在这里加而不是放进 check-all：
        #   npm audit 要联网，离线跑门禁时会假红；CI 一定联网，放这里最合适。
        # 分两段判，语义不同：
        #   ① 运行时依赖必须**零漏洞**（这一条是给使用者的承诺，任何级别都不接受）
        #   ② 开发链只拦 high/critical —— moderate 可能是无法修的传递依赖，
        #      把它也判红会逼着人加忽略名单，反而失去意义。
        run: |
          echo '--- 运行时依赖（--omit=dev）---'
          npm audit --omit=dev --audit-level=low
          echo '--- 含开发链（只拦 high 及以上）---'
          npm audit --audit-level=high

      - name: 单元测试
        run: npm test

      - name: 类型契约（正例必过 + 反例必挂）
        run: python3 05-audit/tsc-gate.py

      # 🔴 私有词表**不进仓库**（它本身就含真实代号），所以 CI 上默认缺席。
      #   缺席时 leak-scan 会打印「⚠️ 私有词表未加载（0 条）⇒ 本次未覆盖」，
      #   而 check-all 照样可能全绿 —— 那就是**判据变弱但没人知道**。
      #   ⇒ 两条：① 有 secret 就用；② 没有就显式打一条 notice，别假装覆盖了。
      - name: 载入私有词表（可选，缺失时明示未覆盖）
        env:
          FL_TERMS: ${{ secrets.FL_PRIVATE_TERMS }}
        run: |
          set -eu
          if [ -n "${FL_TERMS:-}" ]; then
            mkdir -p internal
            printf '%s\n' "$FL_TERMS" > internal/private-terms.txt
            n=$(grep -vcE '^[[:space:]]*(#|$)' internal/private-terms.txt || true)
            echo "私有词表已载入：${n} 条（内容不回显）"
          else
            echo "::notice title=leak 判据不完整::仓库 secret FL_PRIVATE_TERMS 未配置 —— 真实代号/用户名那一类在 CI 上不覆盖（本地跑仍覆盖）。配置方式见 CONTRIBUTING「私有词表」一节。"
          fi

      - name: 静态门禁
        # 🔴🔴 0.8.9 改：不再手挑门禁清单，改为调用 `MODE=fast bash 05-audit/check-all.sh`。
        #
        #   为什么必须改（这是 P0-1 的**同源病根**，只是长在 CI 上）：
        #     原来这里手挑了 10 道门禁，而 check-all.sh 里注册了 **135 道**。
        #     ⇒ 上面每一轮修的门禁 —— 包括 P0-1 修好的七道假绿门禁
        #       （hardcode / icon / measure / license / numeric / tierA / reuse-check）
        #       与新增的 rewrite-residue-gate —— **在 CI 上一次都没跑过**。
        #     ⇒ 「本地全绿、CI 也全绿」这个判断在 125 道上从来没成立过。
        #
        #   为什么手挑必然漏：清单是**另一份**「哪些门禁重要」的表述，
        #     而门禁清单本身就在 check-all.sh 里 —— 两份清单必然漂移。
        #     这与 05-audit 的重复判定（E31）是同一个病：
        #     **同一个决定写两遍 ⇒ 迟早打架。**
        #
        #   MODE=fast 会跳过浏览器类门禁（需 Chromium），那是 `browsers` job 的事；
        #   静态部分与本地跑的**完全同一份代码**，不再有「CI 少跑了哪些」这个问题。
        run: MODE=fast bash 05-audit/check-all.sh

      # ⚠️ 上面那个 run 的环境是 ubuntu，check-all.sh 里的 python3 就是系统 python3。
      #   Windows 上 `PY` 指向托管 python —— 两边脚本同源，只是解释器不同。
      - name: 版本四处一致（手改版本号是最常见的自相矛盾来源）
        run: python3 05-audit/bump-version.py --check

      # 🔴 0.27.24（基线对齐自动化）：同 release-qualify 的自动派发步——
      #    visual-stamp 过期/缺失 ⇒ 自动派发 record-baseline（master 上）。
      #    门禁照旧红；合并基线分支仍是人工像素复核点。
      - name: 基线过期 → 自动派发重录
        if: always() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f 05-audit/.stamp-stale.json ]; then
            cat 05-audit/.stamp-stale.json
            gh workflow run record-baseline.yml -f dir=all --ref master
            {
              echo "⯈ 视觉基线过期/缺失 —— 已自动派发 record-baseline.yml"
              echo "⯈ run 完成后：git fetch origin 'refs/heads/baseline/linux-<runid>:refs/remotes/origin/baseline-<runid>'"
              echo "    git checkout origin/baseline-<runid> -- 10-review/shots/ 05-audit/print-baseline-*.json"
              echo "    git commit + push  ← 像素 diff 的人工复核点，别跳过"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 打包实装冒烟（npm pack → 装进空项目 → 核对）
        run: bash 05-audit/pack-smoke.sh

      # 🔴 视觉门禁红了必须能**看图**：diff 图和当前截图都在这里。
      #   没有它，CI 上的 "FAIL 03-patterns_tree.png 7.6%" 只能靠猜
      #   （本机看不到那台机器的渲染结果）。
      - name: 失败时上传视觉证据
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-evidence-${{ github.run_id }}
          path: |
            10-review/shots/_current-*/
            10-review/shots/_diff-*/
          retention-days: 7
          if-no-files-found: ignore

  # ==================================================================
  # ② API 契约 —— 需要浏览器，但只要本地静态服务
  # ==================================================================
  contract:
    name: API 契约（运行时 ↔ 类型 ↔ 文档）
    # push 只跑 quick：契约要装 Chromium，12 分钟，留给 PR / nightly。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: 按锁文件安装
        run: npm ci

      # 契约类门禁需要真实浏览器里创建实例
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行时 API 形状 ↔ 类型声明
        run: python3 05-audit/api-contract-gate.py

      - name: API.md 接入形态 ↔ 实现
        run: python3 05-audit/api-form-gate.py

      - name: API 文档一致性
        run: python3 05-audit/api-doc-gate.py

  # ==================================================================
  # ③ nightly 浏览器矩阵 —— 含 WebKit
  # ==================================================================
  #⭐ 为什么 WebKit 比 Firefox 重要
  #    本库定位是**移动 WebView**，iOS 上就是 WebKit。
  #    而此前矩阵里是Chromium + Firefox（两个桌面浏览器），
  #    唯独漏了真正的目标平台 —— **优先级排错了**。
  browsers:
    name: 浏览器矩阵（${{ matrix.name }}）
    # PR 不跑（省额度）；push 也不跑（只留 quick）；nightly / 手动跑全矩阵。
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    # 🔴 0.27.21：组件层 127 道首次进 CI（此前手挑 10 个）⇒
    #    20 分钟是按手挑清单估的，换 MODE=component 后不够用，提到 45
    #    （与 quick 同级；本地实测组件层分钟级，CI 加引擎安装余量）。
    timeout-minutes: 45
    strategy:
      fail-fast: false          # 一个引擎挂不影响其它引擎的报告
      matrix:
        include:
          - name: chromium
            engine: chromium
          - name: webkit
            engine: webkit
          - name: firefox
            engine: firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 🔴 fetch-depth: 0 + fetch-tags —— release 门禁要核 "版本有没有 tag 锚点"。
          #    默认 depth=1 时 tag 指向的是祖先提交，**根本不会被抓下来**，
          #    于是 CI 从 2026-10-19 起一直是红的（本地全绿，没人看出为什么）。
          #    仓库只有 2 MB，全量检出比一次误诊便宜得多。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 🔴 0.27.21：print / a11y-ax / zoom-reflow /
      #   skel-lever 在首跑全引擎齐红（chromium 也红，本地 Windows 全绿）——
      #   ubuntu 镜像没有 CJK/阿拉伯/希伯来字体，文字度量变了 ⇒ 溢出、
      #   行数、可访问名全漂。quick job 早有这条（42 张基线全红的教训），
      #   browsers job 漏了。与 ci-fonts.sh 锚定的基线同源。
      - name: 装 CI 字体（print / a11y / zoom / skel 类判据锚在它上面）
        run: bash 05-audit/ci-fonts.sh

      - name: 按锁文件安装
        run: npm ci

      - name: 安装 ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # 🔴 引擎自证（评审给的验收标准，2026-10-09 加）
      #    光有 matrix.engine 不够 —— 它以前只用在 install 这一步，
      #    测试启动器根本没收到 ⇒ 三个作业跑的都是 Chromium。
      #    ⇒ 必须由作业自己站出来报一次 UA，并校验它与声明的引擎一致。
      #      （Chromium 的 UA 里也含 "AppleWebKit"，所以不能只判这个子串）
      - name: 引擎自证（${{ matrix.engine }}）
        run: node 05-audit/engine-probe.js
        env:
          FL_ENGINE: ${{ matrix.engine }}

      # 视觉基线是本机生成的，跨平台必然不一致 ⇒ nightly 只跑不依赖截图的
      # 🔴 0.27.21：手挑 10 个文件换成 check-all 的**组件层**。
      #   ① 127 道 component 门禁此前从未进过 CI（grep 全仓零命中）——
      #          手挑清单是"另一份哪些门禁重要的表述"，与 check-all.sh 的
      #          注册表必然漂移（E31 同源病，0.8.9 在静态层已经吃过一次）。
      #          ⇒ 首跑预计红一片：**红是真实状态**，分类处置
      #            （产品缺陷修代码 / 环境写 README），不许为绿改判据。
      #   ② 手挑清单里 accordion-check.js / tabs-check.js 根本不存在
      #          （真名是 -contract.js），`if [ -f ]` 没有 else ⇒ **静默跳过
      #          = 没查**，报告里还显示绿。
      #   ③ `python3 -m http.server` 的 listen backlog=5 在浏览器并发
      #          拉资源时被内核拒绝 ⇒ 工具门禁偶发假红（check-all.sh 立法
      #          同源）。改由 check-all 自己起 http-serve.py：带
      #          X-FL-Gate-Server 身份戳，backlog 足量，且复用判定与本地一致。
      - name: 组件层门禁（${{ matrix.engine }}）
        env:
          # ⭐ 这一行就是"矩阵真的分引擎"的开关：没有它，三个作业跑同一个浏览器
          FL_ENGINE: ${{ matrix.engine }}
        # 🔴 0.27.24（第三态上浮）：check-all 的退出码法典
        #   （check-all.sh 唯一 EXIT 出口处的码位表）：0=全绿 / 1=有失败 /
        #   2=用法或环境 / 3=有未判定且无失败 / 4=既有失败又有未判定。
        #   实测：firefox「执行 129 道全部通过 + 22 道未判定」→ exit 3 →
        #   本步骤按失败上色 ⇒ 非 chromium 引擎的矩阵 job **按构造恒红**
        #   （chromium 上 print-adv 的 Linux 第三态同理，未判定 2 道）。
        #   ⇒ 矩阵的职责是"可执行的判据全部通过"；未判定门禁在上方日志
        #     逐道列了显式原因（跑不了 ≠ 通过 ≠ 失败）。exit 3 上浮为绿，
        #     但把判定写进 step summary——「未判定」继续可见，不是悄悄吞掉。
        #     1 / 2 / 4 照旧红。
        run: |
          # ⚠️ GitHub 的 run 默认 bash -e：check-all 退出 3 会让 shell 当场
          #    中止，code=$? 根本执行不到（run 44943881582 实测：firefox
          #    照旧 exit 3）。用 || 惯用法把退出码接住。
          MODE=component bash 05-audit/check-all.sh || code=$?
          code=${code:-0}
          if [ "$code" -eq 3 ]; then
            echo "⯈ ${{ matrix.engine }}：已执行判据全部通过；部分门禁未判定（显式 SKIP，逐道理由见上方日志）—— 第三态，未判定 ≠ 通过" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-${{ matrix.engine }}
          path: 10-review/shots/
          retention-days: 7
