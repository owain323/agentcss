name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 文档站与根索引页是**生成物**（真值 = ai/components.json + 各组件 README），
      # 产物本身入库。这里只核一件事：入库的产物是不是现算的。
      # 不一致就失败 —— 改了 README 忘了重跑，不该原样发到线上。
      # ⚠️ 门禁是**只读**的（现算到内存再比），所以这一步不会改工作区。
      - name: Docs up to date
        run: python3 05-audit/docs-site-gate.py
      - name: Assemble site（白名单：默认拒绝，只发产品面）
        run: |
          mkdir -p _site
          # 🔴🔴 2026-11-22 由「黑名单排除」改成「白名单发布」（事故驱动）
          # ------------------------------------------------------------------
          # 事故：WO-HANDOFF.md（正文含一枚 API key）00:24 提交、00:24:14 推送，
          #   而本步当时是 `rsync ./ _site/` + 一串 --exclude —— **新文件默认发布**。
          #   ⇒ 那 31 分钟里 https://owain323.github.io/agentcss/WO-HANDOFF.md
          #     是可猜到的直链，不必翻 git 历史。
          #
          # 判据：安全的默认值是**拒绝**。新增根文件不该因为"没人记得加 exclude"
          #   就自动上公网。所以改成白名单 + 末尾 --exclude '*'。
          #
          # 白名单依据（实测，非估计）：
          #   · 站点实际依赖：index.html / 404.html / 01-04 组件目录 / 09-assets /
          #     ai / docs / examples / guide，以及 guide 里链到的 ../SUPPORT.md
          #   · 演练结果：336 个文件、**HTML 页面 0 缺失**、
          #     死链数与改前完全一致（11 条，均为 404.html 的历史绝对路径）
          #   · 被挡在外面的：README/AGENTS/package.json/.npmrc/CHANGELOG/
          #     05-audit/benchmark/type-tests/10-review/ 以及**任何未来新增的根文件**
          # ------------------------------------------------------------------
          rsync -a \
            --include '/index.html' \
            --include '/404.html' \
            --include '/SUPPORT.md' \
            --include '/01-tokens/' --include '/01-tokens/**' \
            --include '/02-primitives/' --include '/02-primitives/**' \
            --include '/03-patterns/' --include '/03-patterns/**' \
            --include '/04-recipes/' --include '/04-recipes/**' \
            --include '/09-assets/' --include '/09-assets/**' \
            --include '/ai/' --include '/ai/**' \
            --include '/docs/' --include '/docs/**' \
            --include '/examples/' --include '/examples/**' \
            --include '/guide/' --include '/guide/**' \
            --exclude '*' \
            ./ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
