name: pages

# `uses:` 一律钉提交 SHA + 行尾版本号 —— 理由见 gate.yml 头部的「供应链」段。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 🔴 2026-11-23：仓库转私有后**没有 Pages 站点**（私有仓库的 Pages 需要付费
    #   计划），而 configure-pages 在站点不存在时必红 —— 实测 2026-11-22 之后
    #   每次 push 都红（run 45051077201：`Get Pages site failed … 404`）。
    #   一个每次必红的 job 会被训练成"忽略它"，那正是本仓库最反对的东西。
    #   ⇒ 按可见性**如实跳过**：私有期间站点确实不存在，工作流不该假装在发布。
    #     仓库转回公开的当天自动恢复，不用改代码。
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 文档站与根索引页是**生成物**（真值 = ai/components.json + 各组件 README），
      # 产物本身入库。这里只核一件事：入库的产物是不是现算的。
      # 不一致就失败 —— 改了 README 忘了重跑，不该原样发到线上。
      # ⚠️ 门禁是**只读**的（现算到内存再比），所以这一步不会改工作区。
      - name: Docs up to date
        run: python3 05-audit/docs-site-gate.py
      - name: Assemble site（白名单：默认拒绝，只发产品面）
        run: |
          mkdir -p _site
          # 🔴🔴 由「黑名单排除」改成「白名单发布」
          # ------------------------------------------------------------------
          # 判据：安全的默认值是**拒绝**。`rsync ./ _site/` + 一串 --exclude
          #   意味着**新文件默认发布** —— 新增一个根文件不会因为"没人记得
          #   加 exclude"就自动上公网。改成白名单 + 末尾 --exclude '*'。
          #   （这条不是理论偏好：旧的默认发布确实把不该发的东西发出去过。）
          #
          # 白名单依据（实测，非估计）：
          #   · 站点实际依赖：index.html / 404.html / 01-04 组件目录 / 09-assets /
          #     ai / docs / examples / guide，以及 guide 里链到的 ../SUPPORT.md
          #   · 演练结果：336 个文件、**HTML 页面 0 缺失**、
          #     死链数与改前完全一致（11 条，均为 404.html 的历史绝对路径）
          #   · 被挡在外面的：README/AGENTS/package.json/.npmrc/CHANGELOG/
          #     05-audit/benchmark/type-tests/10-review/ 以及**任何未来新增的根文件**
          # ------------------------------------------------------------------
          rsync -a \
            --include '/index.html' \
            --include '/404.html' \
            --include '/SUPPORT.md' \
            --include '/01-tokens/' --include '/01-tokens/**' \
            --include '/02-primitives/' --include '/02-primitives/**' \
            --include '/03-patterns/' --include '/03-patterns/**' \
            --include '/04-recipes/' --include '/04-recipes/**' \
            --include '/09-assets/' --include '/09-assets/**' \
            --include '/ai/' --include '/ai/**' \
            --include '/docs/' --include '/docs/**' \
            --include '/examples/' --include '/examples/**' \
            --include '/guide/' --include '/guide/**' \
            --exclude '*' \
            ./ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
